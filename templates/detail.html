<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ component.id }} Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <a href="/" class="btn btn-outline-secondary mb-3">← Back to Dashboard</a>
    
    <div class="card shadow-lg">
        <div class="row g-0">
            <div class="col-md-5 bg-white d-flex align-items-center justify-content-center p-3">
                <img src="/static/{{ component.image_path }}" class="img-fluid rounded" alt="Component Image">
            </div>
            
            <div class="col-md-7">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h2 class="card-title">{{ component.manufacturer }} {{ component.model }}</h2>
                        <span class="badge bg-primary fs-6 align-self-center">{{ component.type|upper }}</span>
                    </div>
                    <p class="text-muted">ID: {{ component.id }}</p>
                    <hr>
                    
                    <h5>Technical Specifications</h5>
                    <table class="table table-striped table-hover">
                        <tbody>
                            {% for key, value in specs.items() %}
                            <tr>
                                <th scope="row" class="text-capitalize">{{ key.replace('_', ' ') }}</th>
                                <td>{{ value }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>

                    <div class="mt-4">
                        <a href="{{ component.source_url }}" target="_blank" class="btn btn-info text-white">View Original Source</a>
                        <a href="{{ url_for('export_json', id=component.id) }}" class="btn btn-dark">⬇ Export JSON</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
